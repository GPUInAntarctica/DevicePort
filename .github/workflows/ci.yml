name: Go Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1

  cross-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Linux binaries
        run: make build
      - name: Windows binaries
        run: make build-windows
      - name: Android arm64 binary
        run: make build-android
      - uses: actions/upload-artifact@v4
        with:
          name: deviceport-v0.1-binaries
          path: bin/
